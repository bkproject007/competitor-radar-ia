name: Monitor public competitor pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: competitor-state-${{ github.run_id }}
          restore-keys: |
            competitor-state-
      - name: Monitor
        run: python -m src.monitor
      - name: Save snapshot
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: competitor-state-${{ github.run_id }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: competitor-report
          path: reports/latest.md
          retention-days: 30
